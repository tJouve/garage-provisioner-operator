apiVersion: smokingcat.net/v1alpha1
kind: GarageKey
metadata:
  name: bucket-sample-key
  namespace: garage
spec:
  bucketRef:
    name: bucket-sample
    namespace: garage
  bucketPermissions:
    read: true
    write: true
    owner: false
  secretRef:
    name: bucket-sample-s3-credentials
  refreshInterval: "24h"
