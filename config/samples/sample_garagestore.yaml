apiVersion: smokingcat.net/v1alpha1
kind: GarageStore
metadata:
  labels:
    app.kubernetes.io/name: garage-provisioner-operator
    app.kubernetes.io/managed-by: kustomize
  name: garagestore-sample
  namespace: garage
spec:
  adminURL: http://admin.garage.smokingcat.net:3903
  zone: garage
  s3EndpointURL: http://garage.smokingcat.net:3900
  adminSecretRef:
    name: garage-admin-secret
    namespace: garage
  refreshInterval: "24h"
