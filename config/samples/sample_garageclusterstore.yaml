apiVersion: smokingcat.net/v1alpha1
kind: GarageClusterStore
metadata:
  labels:
    app.kubernetes.io/name: garage-provisioner-operator
    app.kubernetes.io/managed-by: kustomize
  name: garageclusterstore-sample
  namespace: operators
spec:
  adminURL: http://admin.garage.example.org:3903
  zone: garage
  s3EndpointURL: http://garage.example.org:3900
  adminSecretRef:
    name: garage-admin-secret
    namespace: operators
  refreshInterval: "24h"
