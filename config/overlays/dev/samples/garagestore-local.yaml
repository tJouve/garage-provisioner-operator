apiVersion: smokingcat.net/v1alpha1
kind: GarageStore
metadata:
  name: local-garage
  namespace: garage-provisioner-operator-system
spec:
  adminURL: http://host.docker.internal:3903
  zone: garage
  s3EndpointURL: http://host.docker.internal:3900
  adminSecretRef:
    name: garage-admin-secret
    namespace: operators
  refreshInterval: "24h"
