apiVersion: smokingcat.net/v1alpha1
kind: GarageBucket
metadata:
  name: test-bucket
  namespace: default
spec:
  garageStoreRef:
    name: local-garage
    kind: GarageStore
  globalAlias: test-bucket-alias
  quotas:
    maxSize: 10737418240
    maxObjects: 1000000
  deletionPolicy: Delete
  refreshInterval: "24h"
