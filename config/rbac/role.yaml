---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - "events.k8s.io"
  resources:
  - events
  verbs:
  - create
  - get
  - list
  - patch
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - get
  - list
  - patch
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
- apiGroups:
  - smokingcat.net
  resources:
  - garagebuckets
  - garagekeys
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - smokingcat.net
  resources:
  - garagebuckets/finalizers
  - garagekeys/finalizers
  verbs:
  - update
- apiGroups:
  - smokingcat.net
  resources:
  - garagebuckets/status
  - garagekeys/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - smokingcat.net
  resources:
  - garageclusterstores
  - garagestores
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - smokingcat.net
  resources:
  - garageclusterstores/status
  - garagestores/status
  verbs:
  - patch
  - update
