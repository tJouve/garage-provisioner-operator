# This rule is not used by the project garage-provisioner-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to smokingcat.net resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: garage-provisioner-operator
    app.kubernetes.io/managed-by: kustomize
  name: garageclusterstore-viewer-role
rules:
- apiGroups:
  - smokingcat.net
  resources:
  - garageclusterstores
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - smokingcat.net
  resources:
  - garageclusterstores/status
  verbs:
  - get
